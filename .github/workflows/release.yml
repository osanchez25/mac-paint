name: Release

# Push a tag like v0.2.0 to build Paint.app on a Mac and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Build Paint.app and the .dmg
        run: npm run tauri build -- --bundles app,dmg
      - name: Zip the Finder Quick Action
        run: cd macos && zip -r "../Edit-in-Paint-Quick-Action.zip" "Edit in Paint.workflow"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          gh release create "$GITHUB_REF_NAME" "$dmg" Edit-in-Paint-Quick-Action.zip \
            --title "Paint for Mac $GITHUB_REF_NAME" --generate-notes \
            --notes "**Install:** open the .dmg and drag Paint to Applications. The app is not signed with an Apple Developer ID, so the first time macOS blocks it: open **System Settings → Privacy & Security** and click **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/Paint.app\`). For the Finder right-click **Edit in Paint**, unzip the Quick Action and double-click it. Requires macOS 14+ on Apple silicon."
